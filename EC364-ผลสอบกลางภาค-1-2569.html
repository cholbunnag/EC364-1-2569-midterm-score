<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ผลสอบกลางภาค EC364</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ef; --sheet:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e2ded5;
  --accent:#8c1d24; --accent-soft:#f7e7e6; --gold:#8a6a1f; --gold-soft:#f5eedc;
  --ok:#2f7a4a; --ok-soft:#e5f2ea; --mid:#a46412; --mid-soft:#f8eddc; --bad:#b3262d; --bad-soft:#f8e3e3;
  --bar:#d9d4c8; --you:#8c1d24;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16181b; --sheet:#1f2226; --ink:#eceae4; --muted:#a3a8ae; --line:#33373d;
  --accent:#f08a84; --accent-soft:#3a2326; --gold:#d6b46a; --gold-soft:#2f2a1d;
  --ok:#6cc08a; --ok-soft:#1d3226; --mid:#e2a64e; --mid-soft:#352a19; --bad:#ef7a73; --bad-soft:#3a2224;
  --bar:#3a3f46; --you:#f08a84; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181b; --sheet:#1f2226; --ink:#eceae4; --muted:#a3a8ae; --line:#33373d;
  --accent:#f08a84; --accent-soft:#3a2326; --gold:#d6b46a; --gold-soft:#2f2a1d;
  --ok:#6cc08a; --ok-soft:#1d3226; --mid:#e2a64e; --mid-soft:#352a19; --bad:#ef7a73; --bad-soft:#3a2224;
  --bar:#3a3f46; --you:#f08a84; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 48px}
.eyebrow{font-size:.8rem;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
h1{font-size:1.6rem;line-height:1.3;margin:4px 0 2px}
h2{font-size:1.15rem;margin:0}
h3{font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.9rem}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px 18px}
header{margin-bottom:18px}
/* login */
.login{max-width:440px}
.login form{display:grid;gap:12px;margin-top:12px}
label{font-weight:600;font-size:.92rem}
input{width:100%;font:inherit;font-size:1.05rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);letter-spacing:.04em}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600}
:root[data-theme="dark"] .btn{color:#1f1112}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#1f1112}}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.ghost,:root .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--bad);font-size:.92rem;min-height:1.4em}
.privacy{margin-top:14px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
/* summary */
.sum{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end}
.who{grid-column:1/-1}
.who b{font-size:1.1rem}
.idnote{grid-column:1/-1;background:var(--gold-soft);color:var(--ink);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;font-size:.9rem}
.big{font-size:2.6rem;font-weight:700;line-height:1}
.gradebig{font-size:2.6rem;font-weight:700;line-height:1;color:var(--accent);text-align:right}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;grid-column:1/-1;font-size:.95rem}
.kv span b{font-weight:600}
.cmp{grid-column:1/-1;margin-top:6px}
.hist{display:flex;align-items:flex-end;gap:4px;height:90px;margin:10px 0 4px}
.hist .b{flex:1;background:var(--bar);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.hist .b.you{background:var(--you)}
.hx{display:flex;gap:4px;font-size:.72rem;color:var(--muted)}
.hx span{flex:1;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.qmini{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.qmini .t{font-size:.86rem;color:var(--muted)}
.qmini .s{display:flex;justify-content:space-between;align-items:baseline}
.qmini .s b{font-size:1.25rem}
.qmini .g{font-weight:700;color:var(--accent)}
.meter{height:6px;background:var(--bar);border-radius:3px;margin-top:6px;position:relative;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.meter em{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);opacity:.55}
/* question detail */
details.q{margin-top:14px;background:var(--sheet);border:1px solid var(--line);border-radius:12px}
details.q>summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary .qs{font-weight:700;font-size:1.1rem;text-align:right}
details.q>summary .qs small{font-weight:500;color:var(--muted);font-size:.85rem}
details.q>summary .chev{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
details.q[open]>summary .chev::after{content:"ซ่อนรายละเอียด ▲"}
details.q:not([open])>summary .chev::after{content:"ดูเหตุผลการให้คะแนน ▼"}
.qbody{padding:0 18px 18px;border-top:1px solid var(--line)}
.crit{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.crit div{background:var(--paper);border-radius:8px;padding:8px 10px}
.crit .l{font-size:.8rem;color:var(--muted)}
.crit .v{font-weight:700;font-size:1.05rem}
.crit .w{font-size:.75rem;color:var(--muted)}
.issue{border-top:1px dashed var(--line);padding:14px 0 4px}
.issue:first-of-type{border-top:0}
.ih{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dots{display:flex;gap:3px;flex-shrink:0;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--bar);display:inline-block}
.dots i.on{background:var(--accent)}
.dots b{margin-left:6px;font-size:.95rem}
.why{margin:8px 0;background:var(--gold-soft);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;font-size:.93rem}
.why .lb{font-weight:600;color:var(--gold);margin-right:4px}
ul.pts{list-style:none;margin:6px 0;padding:0}
ul.pts li{display:grid;grid-template-columns:22px 1fr;gap:4px;margin:5px 0;font-size:.93rem}
ul.pts li .m{width:14px;height:14px;border-radius:50%;margin-top:.35em;border:2px solid var(--muted);box-sizing:border-box;justify-self:center}
ul.pts li.y .m{background:var(--ok);border-color:var(--ok)} ul.pts li.p .m{border-color:var(--mid);background:linear-gradient(90deg,var(--mid) 50%,transparent 50%)} ul.pts li.n .m{border-color:var(--bar)}
ul.pts li.n .tx{color:var(--muted)}
ul.pts li.add .tx{font-size:.88rem}
.pn{display:block;font-size:.85rem;color:var(--muted)}
.ptitle{font-size:.82rem;color:var(--muted);margin-top:8px;font-weight:600}
.miss{margin:8px 0 0;padding:8px 10px;background:var(--bad-soft);border-radius:6px;font-size:.9rem}
.miss ul{margin:4px 0 0 18px;padding:0}
.block{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--paper)}
.tnote{margin-top:14px;background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 12px;border-radius:6px}
.tnote b{color:var(--accent)}
.method{margin-top:22px;font-size:.88rem;color:var(--muted)}
.method table{border-collapse:collapse;margin-top:6px}
.method td{padding:2px 10px 2px 0}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hidden{display:none!important}
@media (max-width:520px){
  .crit{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .crit div{padding:6px 8px}
  .big,.gradebig{font-size:2.1rem}
  .ih{flex-direction:column;gap:4px}
}
@media print{body{background:#fff}.bar-top button,.login{display:none}details.q{break-inside:avoid}}
</style>
</head>

<div class="wrap">
  <header>
    <div class="eyebrow">ศ.364 เศรษฐศาสตร์ว่าด้วยการพัฒนาท้องถิ่น · ภาค 1/2569</div>
    <h1>ผลสอบกลางภาค</h1>
    <div class="sub">ผศ. ชล บุนนาค · คณะเศรษฐศาสตร์ มหาวิทยาลัยธรรมศาสตร์</div>
  </header>

  <section class="card login" id="loginCard">

    <form id="loginForm" autocomplete="off" novalidate>
      <div><label for="sid">เลขทะเบียนนักศึกษา</label>
        <input id="sid" inputmode="numeric" maxlength="10" placeholder="เช่น 6604610000" required></div>
      <div id="pinRow" class="hidden"><label for="pin">รหัสส่วนตัว</label>
        <input id="pin" maxlength="6" placeholder="6 ตัวอักษร" autocapitalize="characters" spellcheck="false" required></div>
      <button class="btn" id="go" type="submit">ดูผลสอบ</button>
      <div class="err" id="err" role="alert"></div>
    </form>

</div>

<script>
const P=JSON.parse(document.getElementById("payload").textContent);
const $=s=>document.querySelector(s);
if(P.usePin){ $("#pinRow").classList.remove("hidden"); $("#loginSub").textContent="กรอกเลขทะเบียนและรหัสส่วนตัว 6 ตัวที่อาจารย์ส่งให้แต่ละคน"; $("#privacyNote").textContent="ข้อมูลผลสอบในหน้านี้ถูกเข้ารหัสแยกรายคน เปิดอ่านได้เฉพาะเมื่อกรอกเลขทะเบียนคู่กับรหัสส่วนตัวที่ถูกต้อง หน้าไม่ได้เก็บรหัสที่กรอกไว้ และไม่มีการส่งข้อมูลออกจากเครื่อง · กรุณาอย่าส่งต่อรหัสส่วนตัวให้ผู้อื่น"; }
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f2=n=>(+n).toFixed(2);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(t){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");}
async function openRec(sid,pin){
  const idx=(await sha(P.idxSalt+sid)).slice(0,20); const r=P.rec[idx]; if(!r) return null;
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(sid+":"+pin),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(r[0]),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  try{ const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(r[1])},key,b64(r[2])); const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); return JSON.parse(txt); }
  catch(e){ return false; }
}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const sid=$("#sid").value.replace(/\D/g,""), pin=P.usePin?$("#pin").value.trim().toUpperCase():"";
  const err=$("#err"); err.textContent="";
  if(sid.length!==10){ err.textContent="กรุณากรอกเลขทะเบียน 10 หลัก"; return; }
  if(P.usePin&&pin.length!==6){ err.textContent="กรุณากรอกรหัสส่วนตัว 6 ตัวอักษร"; return; }
  if(!window.crypto?.subtle||typeof DecompressionStream==="undefined"){ err.textContent="เบราว์เซอร์นี้ถอดรหัสไม่ได้ กรุณาเปิดด้วย Chrome, Safari หรือ Edge รุ่นใหม่"; return; }
  const b=$("#go"); b.disabled=true; b.textContent="กำลังเปิดผลสอบ…";
  let rec; try{ rec=await openRec(sid,pin); }catch(x){ rec=false; }
  b.disabled=false; b.textContent="ดูผลสอบ";
  if(!rec){ err.textContent=P.usePin?"เลขทะเบียนหรือรหัสส่วนตัวไม่ถูกต้อง (หากมั่นใจว่าถูกต้อง กรุณาติดต่ออาจารย์)":"ไม่พบผลสอบของเลขทะเบียนนี้ (หากมั่นใจว่าถูกต้อง กรุณาติดต่ออาจารย์)"; $("#pin").value=""; return; }
  $("#pin").value=""; render(rec);
});
function dots(v){ return `<span class="dots" aria-label="${v} จาก 5">${[1,2,3,4,5].map(i=>`<i class="${i<=v?"on":""}"></i>`).join("")}<b class="num">${v}/5</b></span>`; }
function render(r){
  const S=P.stats;
  const bin=Math.min(Math.floor(r.raw/8),S.hist.length-1), hmax=Math.max(...S.hist);
  const qs=r.q.map((q,i)=>{const sq=S.q[i]; return `<div class="qmini"><div class="t">${esc(q.label)}</div>
      <div class="s"><b class="num">${f2(q.raw)}<span class="sub">/${q.full}</span></b><span class="g">${esc(q.g)}</span></div>
      <div class="meter" title="เส้นดำ = ค่าเฉลี่ยชั้นเรียน ${f2(sq.mean)}"><i style="width:${q.raw/q.full*100}%"></i><em style="left:${sq.mean/q.full*100}%"></em></div>
      <div class="sub" style="font-size:.78rem;margin-top:4px">เฉลี่ยชั้นเรียน ${f2(sq.mean)}</div></div>`;}).join("");
  const detail=r.q.map((q,qi)=>{
    const iss=q.issues.map((it,ii)=>{
      const key=it.pts.filter(p=>p.key), add=it.pts.filter(p=>!p.key);
      const li=p=>`<li class="${p.s}${p.key?"":" add"}"><span class="m" role="img" aria-label="${p.s==="y"?"พบ":p.s==="p"?"พบบางส่วน":"ไม่พบ"}"></span><span class="tx">${esc(p.t)}${p.n?`<span class="pn">${esc(p.n)}</span>`:""}</span></li>`;
      return `<div class="issue"><div class="ih"><h3>ประเด็น ${ii+1} · ${esc(it.label)} <span class="sub">(น้ำหนัก ${it.w})</span></h3>${dots(it.score)}</div>
        ${it.why?`<div class="why"><span class="lb">ลักษณะคำตอบที่ได้คะแนนนี้:</span>${esc(it.why)}</div>`:it.case?`<div class="why"><span class="lb">หมายเหตุ:</span>คะแนนประเด็นนี้อาจารย์พิจารณาเป็นรายกรณี</div>`:""}
        ${it.sum?`<p class="sub" style="margin:6px 0">สรุปคำตอบของคุณ: ${esc(it.sum)}</p>`:""}
        ${key.length?`<div class="ptitle">เทียบกับแนวคำตอบ</div><ul class="pts">${key.map(li).join("")}</ul>`:""}
        ${add.length?`<div class="ptitle">ประเด็นเสริม</div><ul class="pts">${add.map(li).join("")}</ul>`:""}
        ${it.miss.length?`<div class="miss"><b>สิ่งที่ยังไม่พบในคำตอบ</b><ul>${it.miss.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`:""}</div>`;}).join("");
    return `<details class="q"${qi===0?" open":""}><summary><div><h2>${esc(q.label)}</h2><span class="sub">ร้อยละ ${q.pct} · เกรดรายข้อ ${esc(q.g)}</span></div>
        <div class="qs num">${f2(q.raw)}<small>/${q.full}</small></div><span class="chev"></span></summary>
      <div class="qbody">
        <div class="crit"><div><div class="l">ความถูกต้อง</div><div class="v num">${f2(q.acc)}/5</div><div class="w">น้ำหนัก ${S.weights.c}%</div></div>
          <div><div class="l">การแสดงความรู้</div><div class="v num">${q.k}/5</div><div class="w">น้ำหนัก ${S.weights.k}%</div></div>
          <div><div class="l">การเขียน</div><div class="v">${esc(q.w)}</div><div class="w">น้ำหนัก ${S.weights.w}%</div></div></div>
        ${iss}
        <div class="block"><div class="ih"><h3>การแสดงความรู้</h3>${dots(q.k)}</div>
          ${q.kwhy?`<div class="why"><span class="lb">ลักษณะคำตอบที่ได้คะแนนนี้:</span>${esc(q.kwhy)}</div>`:""}
          ${q.kc.length?`<div class="sub">แนวคิด/ทฤษฎีที่พบในคำตอบ</div><div class="tags">${q.kc.map(c=>`<span>${esc(c)}</span>`).join("")}</div>`:`<div class="sub">ไม่พบการอธิบายแนวคิดหรือทฤษฎีที่ชัดเจน</div>`}</div>
        <div class="block"><h3>การเขียนเรียบเรียง: ${esc(q.w)}</h3>${q.wwhy?`<p class="sub" style="margin:4px 0 0">${esc(q.wwhy)}</p>`:""}</div>
        ${q.note?`<div class="tnote"><b>ความเห็นจากอาจารย์:</b> ${esc(q.note)}</div>`:""}
      </div></details>`;}).join("");
  $("#result").innerHTML=`
    <div class="bar-top"><span class="sub">ผลสอบของ ${esc(r.sid)}</span><span><button class="btn ghost" id="printBtn" type="button">พิมพ์/บันทึก PDF</button> <button class="btn ghost" id="out" type="button">ออก</button></span></div>
    <section class="card"><div class="sum">
      <div class="who"><b>${esc(r.name||"")}</b> <span class="sub num">${esc(r.sid)}</span></div>
      ${r.idNote?`<div class="idnote">${esc(r.idNote)}</div>`:""}
      <div><div class="sub">คะแนนรวม</div><div class="big num">${f2(r.raw)}<span class="sub" style="font-size:1rem"> / ${r.full}</span></div></div>
      <div><div class="sub" style="text-align:right">เกรด</div><div class="gradebig">${esc(r.g)}</div></div>
      <div class="kv"><span>ร้อยละ <b class="num">${r.pct}</b></span><span>คะแนนเก็บ <b class="num">${f2(r.cw)}</b> / ${r.cwFull}</span></div>
      <div class="cmp"><div class="sub">การกระจายคะแนนรวมของชั้นเรียน (${S.n} คน · เฉลี่ย ${f2(S.mean)} · มัธยฐาน ${f2(S.median)})</div>
        <div class="hist" role="img" aria-label="ฮิสโตแกรมคะแนนรวม ช่วงละ 8 คะแนน คะแนนของคุณอยู่ช่วง ${bin*8}–${bin*8+8}">${S.hist.map((v,i)=>`<div class="b${i===bin?" you":""}" style="height:${v/hmax*100}%" title="${i*8}–${i*8+8}: ${v} คน"></div>`).join("")}</div>
        <div class="hx">${S.hist.map((v,i)=>`<span>${i*8}</span>`).join("")}</div>
        <div class="legend"><span><span class="sw" style="background:var(--you)"></span>ช่วงคะแนนของคุณ</span><span><span class="sw" style="background:var(--bar)"></span>จำนวนนักศึกษาในแต่ละช่วง</span></div></div>
    </div>
    <div class="qgrid">${qs}</div></section>
    ${detail}
    <section class="method"><b>วิธีคิดคะแนน</b><br>
      ร้อยละรายข้อ = ความถูกต้อง ${S.weights.c}% (ค่าเฉลี่ยถ่วงน้ำหนักของคะแนนรายประเด็น ÷ 5) + การแสดงความรู้ ${S.weights.k}% (÷ 5) + การเขียน ${S.weights.w}% (ดีมาก ${S.writingPct.vgood}% · ดี ${S.writingPct.good}% · พอใช้ ${S.writingPct.fair}%) · คะแนนรายข้อ = ร้อยละ × คะแนนเต็มข้อ · คะแนนเก็บ = คะแนนรวม ÷ ${r.full} × ${r.cwFull}
      <table><tr>${S.bands.map(b=>`<td>${esc(b[0])} ≥ ${b[1]}%</td>`).join("")}<td>F &lt; ${S.bands[S.bands.length-1][1]}%</td></tr></table>
      <p>ระดับคะแนนรายประเด็น 0–5: 5 ถูกต้องสมบูรณ์ · 4 ถูกเป็นส่วนใหญ่ · 3 ถูกครึ่งหนึ่ง · 2 ถูกบ้าง · 1 ถูกน้อย · 0 ไม่ตอบ/ไม่ถูก · <span class="sw" style="background:var(--ok);border-radius:50%"></span>พบในคำตอบ · <span class="sw" style="background:linear-gradient(90deg,var(--mid) 50%,var(--bar) 50%);border-radius:50%"></span>พบบางส่วน · <span class="sw" style="border:2px solid var(--bar);border-radius:50%;box-sizing:border-box"></span>ไม่พบ</p>
      <p>หากมีข้อสงสัยเกี่ยวกับผลการให้คะแนน ติดต่ออาจารย์ภายในกำหนดที่ประกาศในชั้นเรียน</p></section>`;
  $("#loginCard").classList.add("hidden"); $("#result").classList.remove("hidden");
  $("#out").onclick=()=>{ $("#result").innerHTML=""; $("#result").classList.add("hidden"); $("#loginCard").classList.remove("hidden"); $("#sid").value=""; window.scrollTo(0,0); $("#sid").focus(); };
  $("#printBtn").onclick=()=>{ document.querySelectorAll("details.q").forEach(d=>d.open=true); window.print(); };
  window.scrollTo(0,0);
}
</script>
</body>
</html>
